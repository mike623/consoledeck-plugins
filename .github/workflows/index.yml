name: Index

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write  # main: commits the regenerated index.json

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check plugins and build index.json
        run: python3 tools/build_index.py
      - name: Commit index.json
        if: github.event_name == 'push'
        run: |
          git diff --quiet index.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update index.json" index.json
          git push
